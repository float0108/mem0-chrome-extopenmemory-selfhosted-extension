<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMemory</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Open Sans', 'Helvetica Neue', sans-serif;
        width: 300px;
        margin: 0;
        padding: 14px;
        background-color: var(--om-bg, #1c1c1e);
        color: var(--om-text, white);
      }
      .logo-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .heading {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .content {
        text-align: center;
      }
      .message {
        margin-bottom: 12px;
        color: var(--om-text, #d4d4d8);
        font-size: 12px;
        line-height: 1.5;
      }
      .input-group {
        margin-top: 12px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 12px;
        color: var(--om-muted, #a1a1aa);
        margin-bottom: 6px;
      }
      .input-group input {
        width: 100%;
        padding: 8px 10px;
        background: var(--om-card, #27272a);
        border: 1px solid var(--om-button, #3b3b3f);
        border-radius: 8px;
        color: var(--om-text, white);
        font-size: 12px;
        box-sizing: border-box;
        outline: none;
      }
      .primary-btn {
        color: var(--om-on-action) !important;
        width: 100%;
        padding: 8px;
        background: var(--om-action, #7a5bf7);
        color: var(--om-text, white);
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 12px;
      }
      .primary-btn:hover {
        background: var(--om-action, #6b4ce6);
      }
      .secondary-btn {
        width: 100%;
        padding: 8px;
        background: var(--om-button, #3b3b3f);
        color: var(--om-text, white);
        border: none;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
        margin-top: 8px;
      }
      .secondary-btn:hover {
        background: var(--om-hover, #4b4b4f);
      }
      .link-btn {
        background: none;
        border: none;
        color: var(--om-text, #a78bfa);
        font-size: 12px;
        cursor: pointer;
        margin-top: 12px;
        text-decoration: underline;
      }
      #statusMessage {
        margin-top: 12px;
        font-size: 12px;
        min-height: 1.2em;
      }
      #statusMessage.error {
        color: var(--om-error, #f87171);
      }
      #statusMessage.success {
        color: var(--om-success, #4ade80);
      }
      .hidden {
        display: none !important;
      }
      .connected-badge {
        color: var(--om-success, #4ade80);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .server-hint {
        font-size: 11px;
        color: var(--om-muted, #71717a);
        word-break: break-all;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <h2 class="heading">OpenMemory</h2>
      <div id="themeSwitch"></div>
    </div>

    <div id="setupView" class="content">
      <p class="message">Connect to your self-hosted mem0 instance.</p>
      <div class="input-group">
        <label for="popupUserIdInput">User ID (required)</label>
        <input
          type="text"
          id="popupUserIdInput"
          placeholder="Enter your user ID"
          autocomplete="off"
          required
        />
      </div>
      <div class="input-group">
        <label for="popupApiKeyInput">API key</label>
        <input type="password" id="popupApiKeyInput" placeholder="m0sk_…" autocomplete="off" />
      </div>
      <div class="input-group">
        <label for="popupServerUrlInput">Server URL</label>
        <input
          type="text"
          id="popupServerUrlInput"
          placeholder="http://127.0.0.1:8888"
          value="http://127.0.0.1:8888"
        />
      </div>
      <button type="button" id="saveApiKeyBtn" class="primary-btn">Save</button>
      <p id="statusMessage" role="status"></p>
    </div>

    <div id="connectedView" class="content hidden">
      <p class="connected-badge">Connected</p>
      <p id="connectedServerHint" class="server-hint"></p>
      <p class="message">Open a supported chat site, then use the sidebar or open it from here.</p>
      <button type="button" id="openSidebarBtn" class="primary-btn">Open memory sidebar</button>
      <p id="sidebarStatus" class="message" role="status"></p>
      <button type="button" id="openDashboardBtn" class="secondary-btn">Open mem0 dashboard</button>
      <button type="button" id="editSettingsBtn" class="link-btn">Edit connection settings</button>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
